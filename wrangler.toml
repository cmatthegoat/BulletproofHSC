name = "hsc-mistake-journal"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hsc-mistake-journal"
database_id = "93517d7e-0a64-48aa-8608-b9b7e00b9d0d"
migrations_dir = "migrations"

[vars]
DAILY_AI_LIMIT = "20"
